name: Orvya - Validacao e autodeploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orvya-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configurar SSH
        env:
          DEPLOY_KEY: ${{ secrets.ORVYA_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORVYA_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy e healthcheck na AWS
        env:
          HOST: ${{ secrets.ORVYA_SSH_HOST }}
          USERNAME: ${{ secrets.ORVYA_SSH_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          test -n "$HOST" && test -n "$USERNAME"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USERNAME@$HOST" \
            'bash -s -- '"$SHA" < scripts/deploy-self.sh
